<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your photos</title>
<style>
  /* EDIT: event name is in the <h1> below */
  :root{
    --bg:#f3f6f4; --ink:#14231e; --muted:#5a6b64; --line:#d5ded9;
    --accent:#0f5c4d; --accent-ink:#ffffff; --card:#ffffff; --err:#a3281f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1815; --ink:#e8f0ec; --muted:#97aaa2; --line:#27372f;
           --accent:#5fd3b8; --accent-ink:#06201a; --card:#16231e; --err:#ff8a7e; }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:1rem}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:17px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
  main{max-width:960px;margin:0 auto;padding:clamp(1.5rem,5vw,4rem) 1.25rem 4rem}
  h1{font:600 clamp(2.2rem,7vw,4.2rem)/1.05 "Iowan Old Style","Palatino Linotype",Georgia,serif;
     margin:0 0 1rem;letter-spacing:-.02em;max-width:14ch}
  .lede{color:var(--muted);max-width:46ch;margin:0 0 2rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:1.25rem;max-width:520px}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
        min-height:190px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;
        text-align:center;padding:1rem;overflow:hidden}
  .drop:hover,.drop:focus-within{border-color:var(--accent)}
  .drop img{max-height:170px;border-radius:8px}
  .drop input{position:absolute;opacity:0;width:1px;height:1px}
  .consent{display:flex;gap:.6rem;align-items:flex-start;margin:1rem 0;font-size:.9rem;color:var(--muted)}
  .consent input{margin-top:.3rem;accent-color:var(--accent)}
  button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);
         border:0;border-radius:10px;padding:.8rem 1.4rem;cursor:pointer;width:100%}
  button:disabled{opacity:.45;cursor:not-allowed}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #status{margin:1rem 0 0;min-height:1.5em}
  #status.err{color:var(--err)}
  .results-head{display:flex;justify-content:space-between;align-items:baseline;
                margin:3rem 0 1rem;gap:1rem;flex-wrap:wrap}
  .results-head h2{margin:0;font:600 1.6rem Georgia,serif}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
  figure a{display:block;padding:.55rem .8rem;color:var(--accent);font-weight:600;
           font-size:.92rem;text-decoration:none}
  figure a:hover{text-decoration:underline}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Find yourself in the event photos</h1>
  <p class="lede">Upload one clear selfie and we will show every photo you appear in, ready to download.</p>

  <div class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" capture="user">
      <span id="dropText"><strong>Take or choose a selfie</strong><br>Face the camera, good light, no sunglasses</span>
      <img id="preview" alt="Your selfie" hidden>
    </label>
    <label class="consent">
      <input type="checkbox" id="consent">
      <span>I agree that my selfie is used once to find matching photos. It is not saved.</span>
    </label>
    <button id="go" disabled>Find my photos</button>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <section id="results" hidden>
    <div class="results-head">
      <h2 id="count"></h2>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer style="margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;color:var(--muted);">
    <span>Wedding Photo Finder</span>
    <a href="/admin" style="color:var(--muted);text-decoration:none;">🔒 Admin Portal</a>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const file = $('file'), go = $('go'), consent = $('consent'), status = $('status');

function refresh(){ go.disabled = !(file.files[0] && consent.checked); }
file.addEventListener('change', () => {
  const f = file.files[0];
  if (f) { $('preview').src = URL.createObjectURL(f); $('preview').hidden = false; $('dropText').hidden = true; }
  refresh();
});
consent.addEventListener('change', refresh);

function say(msg, isErr){ status.textContent = msg; status.className = isErr ? 'err' : ''; }
const enc = n => n.split('/').map(encodeURIComponent).join('/');

go.addEventListener('click', async () => {
  go.disabled = true; say('Searching, this takes a few seconds...');
  $('results').hidden = true;
  try {
    const body = new FormData(); body.append('selfie', file.files[0]);
    const r = await fetch('/api/search', { method: 'POST', body });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'Something went wrong. Try again.');
    if (j.count === 0) { say('No matching photos yet. Try a different selfie with the face fully visible.', true); }
    else {
      say('');
      $('count').textContent = j.count === 1 ? '1 photo found' : j.count + ' photos found';
      const grid = $('grid'); grid.replaceChildren();
      for (const n of j.photos) {
        const fig = document.createElement('figure');
        const img = new Image(); img.loading = 'lazy'; img.alt = 'Event photo'; img.src = '/thumb/' + enc(n);
        const a = document.createElement('a'); a.href = '/photo/' + enc(n); a.download = ''; a.textContent = 'Download';
        fig.append(img, a); grid.append(fig);
      }
      $('results').hidden = false; $('results').scrollIntoView({ behavior: 'smooth' });
    }
  } catch (e) { say(e.message, true); }
  go.disabled = false; refresh();
});
</script>
</body>
</html>
